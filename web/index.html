<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>biz-agent</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<div class="shell">
			<!-- 最左侧图标栏 -->
			<nav class="rail">
				<div class="rail-logo">B</div>

				<button class="rail-btn" id="rail-new" title="新聊天">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.7-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z" />
					</svg>
				</button>
				<button class="rail-btn" id="rail-history" title="全部会话">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="8.5" />
						<path d="M12 7.5V12l3 2" />
					</svg>
				</button>
				<button class="rail-btn" id="rail-audit" title="运行详情">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<rect x="3.5" y="4.5" width="5" height="15" rx="1.2" />
						<rect x="10.5" y="4.5" width="5" height="10" rx="1.2" />
						<rect x="17.5" y="4.5" width="3" height="6" rx="1.2" />
					</svg>
				</button>
				<button class="rail-btn" id="rail-more" title="更多">
					<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
				</button>

				<div class="rail-spacer"></div>
				<div class="rail-avatar" id="rail-avatar" title="当前用户">LE</div>
			</nav>

			<!-- 侧边栏 -->
			<aside class="sidebar">
				<div class="sidebar-head">
					<button class="workspace" id="workspace">
						biz-agent
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
					</button>
					<div class="head-actions">
						<button class="icon-btn" id="btn-audit" title="运行详情">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
								<path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7" />
								<path d="M10.3 19a2 2 0 0 0 3.4 0" />
							</svg>
						</button>
						<button class="icon-btn" id="btn-search" title="搜索会话">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
								<circle cx="11" cy="11" r="6.5" />
								<path d="m16 16 4 4" />
							</svg>
						</button>
					</div>
				</div>

				<div class="search-row" id="search-row" hidden>
					<input id="search-input" type="search" placeholder="搜索会话标题…" />
				</div>

				<button class="new-chat" id="btn-new">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
						<path d="M16.5 3.9a2.1 2.1 0 0 1 3 3L8 18.4l-4 1 1-4z" />
					</svg>
					新聊天
				</button>

				<div class="group">
					<div class="group-label">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5" /><path d="M9 10.8V4.5" /><path d="M15 10.8V4.5" /><path d="M12 3v4" /><path d="M8 10.8h8v4a4 4 0 0 1-8 0z" /></svg>
						置顶
					</div>
					<div class="item-list" id="pinned-list"></div>
				</div>

				<div class="group">
					<div class="group-label">流程</div>
					<div class="flow-groups" id="flow-groups"></div>
				</div>

				<div class="sidebar-spacer"></div>
			</aside>

			<!-- 主区 -->
			<main class="main">
				<header class="main-head">
					<div class="crumb">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
							<path d="M3.5 7.5a2 2 0 0 1 2-2h3.2l2 2.2h7.8a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
						</svg>
						<span id="session-title">新会话</span>
					</div>
					<div class="head-tools">
						<span class="mode-chip" id="mode-chip">—</span>
						<button class="icon-btn" id="btn-audit-top" title="运行详情">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
								<rect x="3.5" y="4.5" width="5" height="15" rx="1.2" />
								<rect x="10.5" y="4.5" width="5" height="10" rx="1.2" />
								<rect x="17.5" y="4.5" width="3" height="6" rx="1.2" />
							</svg>
						</button>
					</div>
				</header>

				<div class="stepbar" id="stepbar"></div>

				<div class="thread" id="messages">
					<div class="thread-inner" id="thread-inner">
						<div class="empty" id="empty">
							<h2>开始一个新任务</h2>
							<p>在下方描述你要处理的事情，Agent 会按内置流程一步步执行。</p>
						</div>
					</div>
				</div>

				<div class="composer-wrap">
					<form class="composer" id="composer">
						<div class="attachments" id="attachments" hidden></div>
						<textarea id="input" rows="1" placeholder="描述要处理的任务…"></textarea>
						<div class="composer-bar">
							<div class="bar-left">
								<button type="button" class="pill-square" id="btn-attach" title="附加文本文件">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
								</button>
								<input type="file" id="file-input" accept=".txt,.md,.json,.csv,.log,.yaml,.yml" hidden />
								<button type="button" class="pill-access" id="permission-chip" title="切换权限模式">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 8.5v4.7M12 16.2h.01" /></svg>
									<span id="permission-label">完全访问</span>
								</button>
							</div>
							<div class="bar-right">
								<button type="button" class="model-select" id="model-select" title="切换模型">
									<span id="model-name">模拟模型</span>
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
								</button>
								<button type="button" class="icon-btn" id="btn-mic" title="语音输入">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
										<rect x="9" y="3" width="6" height="10" rx="3" />
										<path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
										<path d="M12 17.5V21" />
									</svg>
								</button>
								<button type="submit" class="send-btn" id="send" title="发送">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5" /><path d="m6 11 6-6 6 6" /></svg>
								</button>
							</div>
						</div>
					</form>
					<div class="composer-hint" id="composer-hint">Enter 发送 · Shift + Enter 换行</div>
				</div>
			</main>

			<!-- 右侧抽屉 -->
			<aside class="drawer" id="drawer">
				<div class="drawer-head">
					<span>运行详情</span>
					<button class="icon-btn" id="drawer-close" title="关闭">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
					</button>
				</div>
				<div class="drawer-body">
					<h4>全部会话</h4>
					<div class="session-rows" id="drawer-sessions"></div>

					<h4>流程进度</h4>
					<ol class="steps" id="steps"><li class="placeholder">尚未开始</li></ol>

					<h4>审计流水</h4>
					<div class="audit" id="audit"><div class="placeholder">暂无调用</div></div>
				</div>
			</aside>

			<!-- 浮动菜单 -->
			<div class="menu" id="menu" hidden></div>
		</div>

		<script src="/app.js"></script>
	</body>
</html>
